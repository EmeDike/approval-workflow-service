services:
  postgres:
    image: postgres:16-alpine
    container_name: approval-workflow-postgres
    environment:
      POSTGRES_DB: approval_workflow
      POSTGRES_USER: approval_user
      POSTGRES_PASSWORD: approval_pass
    ports:
      - "5433:5432"
    volumes:
      - approval_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approval_user -d approval_workflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  approval_pg_data: